services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/khata.db
      SEED: "42"
      LLM_PROVIDER: none
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - khata-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  khata-data:
